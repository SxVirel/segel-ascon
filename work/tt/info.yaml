# Tiny Tapeout project information (format TT07, yaml_version 6)
# Dipakai oleh workflow .github/workflows/segel-ascon-gds.yaml untuk mencoba alur GDS TT07.
project:
  title:        "Segel Ascon"      # Project title
  author:       "Tim Segel Ascon (Peruri Chip Hackathon 2026)"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "TT07 SHA-256 baseline + Ascon-AEAD128 MAC (NIST SP 800-232) sharing the same 320-bit register file"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "3x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_sxvirel_segel_ascon"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:
    - "project.v"
    - "sha256_round.v"
    - "ascon_round.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "address bit 0"
  ui[1]: "address bit 1"
  ui[2]: "address bit 2"
  ui[3]: "address bit 3"
  ui[4]: "address bit 4"
  ui[5]: "address bit 5"
  ui[6]: "read/write select (1 = read)"
  ui[7]: "IO strobe (action on rising edge)"

  # Outputs
  uo[0]: "ready"
  uo[1]: "read/write select (mirror)"
  uo[2]: "BUSY"
  uo[3]: "DONE (tag ready)"
  uo[4]: "MODE (1 = Ascon)"
  uo[5]: "KEY_VALID"
  uo[6]: "ERR"
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "data bit 0"
  uio[1]: "data bit 1"
  uio[2]: "data bit 2"
  uio[3]: "data bit 3"
  uio[4]: "data bit 4"
  uio[5]: "data bit 5"
  uio[6]: "data bit 6"
  uio[7]: "data bit 7"

# Do not change!
yaml_version: 6
